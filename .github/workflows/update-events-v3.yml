name: Update Tokyo events v3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/update-events-v3.mjs
      - name: Commit fresh events
        run: |
          git config user.name "tokyo-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json data/review-events.json
          git diff --cached --quiet || git commit -m "data: refresh Tokyo events v3"
          git push
